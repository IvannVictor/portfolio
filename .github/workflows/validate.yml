name: Validar portfólio
on:
  push:
    branches:
      - feature/portfolio-profissional-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Chromium e Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          CHROME=$(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chromium \) | head -n 1)
          test -x "$CHROME"
          echo "CHROMIUM_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Executar smoke tests
        run: python tests/smoke.py
      - name: Testar demonstrações
        run: python tests/demos.py
      - name: Testar fluxo interativo ZPL v3.1
        run: python tests/cases.py
      - name: Testar formulário sem envio real
        run: python tests/contact.py

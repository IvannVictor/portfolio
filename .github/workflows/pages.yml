name: Publicar portfólio no GitHub Pages

# Publicar automaticamente após atualização aprovada da branch principal.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar somente os arquivos públicos
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R css js images demos curriculos _site/
          test -f _site/curriculos/operacoes.html
          test -f _site/curriculos/tecnologia.html
          test -f _site/curriculos/fiscal-contabil.html
          test -f _site/curriculos/liquid-glass.css
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

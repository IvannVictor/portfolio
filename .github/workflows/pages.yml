name: Publicar portfólio no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Montar e validar artefato de publicação
        run: |
          python tests/build_site.py
          python tests/published_site.py _site
      - name: Validar sintaxe JavaScript
        run: |
          for file in js/*.js; do node --check "$file"; done
      - name: Instalar navegador e Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          CHROME=$(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chromium \) | head -n 1)
          test -x "$CHROME"
          echo "CHROMIUM_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Executar testes funcionais antes da publicação
        run: |
          python tests/smoke.py
          python tests/demos.py
          python tests/cases.py
          python tests/contact.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
